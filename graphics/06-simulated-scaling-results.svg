<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <rect width="1600" height="1600" fill="#f8fafc"/>
  <g transform="translate(0 350)">
  <text x="80" y="78" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Simulated agent scaling: coordination makespan</text>
  <text x="80" y="116" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">4 agents · 8 generated tasks · lower is better · agent calls modeled, MAK and git coordination real</text>
  <rect x="1325" y="58" width="190" height="46" rx="23" fill="#dbeafe"/>
  <text x="1420" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">LOWER IS BETTER</text>

  <rect x="55" y="150" width="720" height="615" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="825" y="150" width="720" height="615" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="85" y="200" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Uniform contention</text>
  <text x="855" y="200" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Zipf contention</text>
  <text x="85" y="229" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">Work spread evenly across shared tables</text>
  <text x="855" y="229" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">A few shared tables receive most edits</text>

  <!-- uniform grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="285" y1="260" x2="285" y2="690"/>
    <line x1="390" y1="260" x2="390" y2="690"/>
    <line x1="495" y1="260" x2="495" y2="690"/>
    <line x1="600" y1="260" x2="600" y2="690"/>
    <line x1="705" y1="260" x2="705" y2="690"/>
    <line x1="1055" y1="260" x2="1055" y2="690"/>
    <line x1="1160" y1="260" x2="1160" y2="690"/>
    <line x1="1265" y1="260" x2="1265" y2="690"/>
    <line x1="1370" y1="260" x2="1370" y2="690"/>
    <line x1="1475" y1="260" x2="1475" y2="690"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">
    <text x="285" y="714" text-anchor="middle">0s</text><text x="390" y="714" text-anchor="middle">25s</text><text x="495" y="714" text-anchor="middle">50s</text><text x="600" y="714" text-anchor="middle">75s</text><text x="705" y="714" text-anchor="middle">100s</text>
    <text x="1055" y="714" text-anchor="middle">0s</text><text x="1160" y="714" text-anchor="middle">25s</text><text x="1265" y="714" text-anchor="middle">50s</text><text x="1370" y="714" text-anchor="middle">75s</text><text x="1475" y="714" text-anchor="middle">100s</text>
  </g>

  <!-- uniform labels and bars; scale = 4.2px/s -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">
    <text x="265" y="297" text-anchor="end">Sequential</text>
    <text x="265" y="365" text-anchor="end">Worktree · merge end</text>
    <text x="265" y="433" text-anchor="end">Worktree · merge often</text>
    <text x="265" y="501" text-anchor="end">Worktree · conflict-aware</text>
    <text x="265" y="569" text-anchor="end" font-weight="700">MAK · node locks</text>
    <text x="265" y="637" text-anchor="end">MAK · file locks</text>
  </g>
  <g>
    <rect x="285" y="274" width="420.6" height="34" rx="7" fill="#64748b"/><text x="717" y="297" font-family="Arial" font-size="16" font-weight="700" fill="#334155">100.1s</text>
    <rect x="285" y="342" width="346.5" height="34" rx="7" fill="#ef4444"/><text x="643" y="365" font-family="Arial" font-size="16" font-weight="700" fill="#334155">82.5s</text>
    <rect x="285" y="410" width="262.2" height="34" rx="7" fill="#f97316"/><text x="559" y="433" font-family="Arial" font-size="16" font-weight="700" fill="#334155">62.4s</text>
    <rect x="285" y="478" width="193.0" height="34" rx="7" fill="#f59e0b"/><text x="490" y="501" font-family="Arial" font-size="16" font-weight="700" fill="#334155">45.9s</text>
    <rect x="285" y="546" width="88.9" height="34" rx="7" fill="#2563eb"/><text x="386" y="569" font-family="Arial" font-size="16" font-weight="700" fill="#1d4ed8">21.2s</text>
    <rect x="285" y="614" width="123.5" height="34" rx="7" fill="#60a5fa"/><text x="420" y="637" font-family="Arial" font-size="16" font-weight="700" fill="#334155">29.4s</text>
  </g>

  <!-- zipf labels and bars -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">
    <text x="1035" y="297" text-anchor="end">Sequential</text>
    <text x="1035" y="365" text-anchor="end">Worktree · merge end</text>
    <text x="1035" y="433" text-anchor="end">Worktree · merge often</text>
    <text x="1035" y="501" text-anchor="end">Worktree · conflict-aware</text>
    <text x="1035" y="569" text-anchor="end" font-weight="700">MAK · node locks</text>
    <text x="1035" y="637" text-anchor="end">MAK · file locks</text>
  </g>
  <g>
    <rect x="1055" y="274" width="425.5" height="34" rx="7" fill="#64748b"/><text x="1492" y="297" font-family="Arial" font-size="16" font-weight="700" fill="#334155">101.3s</text>
    <rect x="1055" y="342" width="268.9" height="34" rx="7" fill="#ef4444"/><text x="1336" y="365" font-family="Arial" font-size="16" font-weight="700" fill="#b91c1c">64.0s · 88.9% accuracy</text>
    <rect x="1055" y="410" width="288.3" height="34" rx="7" fill="#f97316"/><text x="1355" y="433" font-family="Arial" font-size="16" font-weight="700" fill="#334155">68.6s</text>
    <rect x="1055" y="478" width="217.2" height="34" rx="7" fill="#f59e0b"/><text x="1284" y="501" font-family="Arial" font-size="16" font-weight="700" fill="#334155">51.7s</text>
    <rect x="1055" y="546" width="88.6" height="34" rx="7" fill="#2563eb"/><text x="1156" y="569" font-family="Arial" font-size="16" font-weight="700" fill="#1d4ed8">21.1s</text>
    <rect x="1055" y="614" width="223.2" height="34" rx="7" fill="#60a5fa"/><text x="1290" y="637" font-family="Arial" font-size="16" font-weight="700" fill="#334155">53.1s</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16">
    <circle cx="90" cy="810" r="7" fill="#2563eb"/><text x="107" y="816" fill="#334155">MAK node locks</text>
    <circle cx="290" cy="810" r="7" fill="#60a5fa"/><text x="307" y="816" fill="#334155">MAK file-lock ablation</text>
    <circle cx="550" cy="810" r="7" fill="#ef4444"/><text x="567" y="816" fill="#334155">Worktree baselines</text>
  </g>
  <text x="80" y="855" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Smoke sweep, seed 21. All arms reached 100% oracle accuracy except Zipf worktree merge-at-end, which lost one registration.</text>
  </g>
</svg>
