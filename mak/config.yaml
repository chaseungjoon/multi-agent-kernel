session:
  work_dir: "."
  mak_dir: ".mak"
  max_concurrent_agents: 3
  lock_timeout_s: 300.0
  deadlock_check_interval_s: 5.0
  # Command run in the work dir during teardown; a zero exit gates auto_push and
  # is reported as "tests passed". Unset (the default) skips the test step.
  # test_command: "pytest -q"
  # Per-bundle budget for the source a task carries from the tasks it depends on.
  # Past the budget an entry degrades to a public API digest (signatures, no
  # bodies) rather than being dropped. 0 disables the layer; -1 is unbounded.
  # dependency_context_bytes: 24000
  # Per-bundle budget for the cross-file caller layer. Past the budget an entry is
  # dropped (a caller's value is its call site, so a digest would say nothing).
  # 0 disables the layer; -1 is unbounded.
  # cross_file_context_bytes: 32000
  # Spend ceiling for one run: input + output tokens across every agent call and
  # the planner's, counted from what each provider reported. Unset (the default)
  # is unbounded. On a breach the run stops dispatching, finishes what is in
  # flight, and fails naming the budget — it never interrupts a commit.
  # max_total_tokens: 2000000
  # What to do with a file that changed since MAK last wrote it — a human's edit
  # between two sessions. "adopt" (the default) takes the working tree as the
  # newer truth and syncs the store to it, including deleted and renamed symbols.
  # "conflict" refuses to continue, raising before planning so no agent is handed
  # content the tree no longer holds.
  # on_external_edit: "adopt"
  # Whether a push may happen when no suite ran. "require_pass" (the default)
  # means only a suite that ran and passed opens the push gate — with no
  # test_command set, auto_push never fires, because "no tests ran" is not "the
  # tests passed". "allow_skip" is the opt-out for a project with no suite.
  # test_policy: "require_pass"

planner:
  model: "claude-opus-5"
  max_retries: 3
  # validate: true          # cross-check the plan against the code dependency
  #                         # graph — ground node ids, add missing depends_on edges
  #                         # (default true; set false to disable augmentation)
  # strategy: "oneshot"     # "oneshot" or "outline" (outline -> per-step detail)
  # self_critique: false    # one extra LLM reflection pass over the produced plan

# The first entry is the default agent: a plan's tasks are distributed across the
# roster round-robin unless a task names its own agent_type. API keys are read
# from the named env var, never stored here. CLI adapter types (claude_code,
# codex, copilot) drive the real CLI through a bundled protocol-bridge wrapper —
# that CLI must be installed on PATH for them to work.
agents:
  - type: "anthropic_api"
    model: "claude-sonnet-5"
    api_key_env: "ANTHROPIC_API_KEY"
    max_instances: 2
    timeout: 300
    # max_tokens: 32000     # output budget for one agent reply. Unset (the
    #                       # default) resolves it from the model catalog for
    #                       # anthropic_api, and sends no cap at all for
    #                       # openai_api / gemini_api (inheriting the model's own
    #                       # maximum). An agent returns a node's WHOLE rewritten
    #                       # source, so a budget under the largest file it may
    #                       # write truncates the reply; set this only to bound
    #                       # spend, or for a local model the catalog does not know.
  - type: "openai_api"
    model: "gpt-5.6-terra"
    api_key_env: "OPENAI_API_KEY"
    max_instances: 2
    timeout: 300
  - type: "gemini_api"
    model: "gemini-3.5-flash"
    api_key_env: "GEMINI_API_KEY"
    max_instances: 2
    timeout: 300
  # - type: "claude_code"   # CLI fallback — needs the `claude` CLI on PATH
  #   cmd: "claude"
  #   max_instances: 2
  #   timeout: 300

# Model catalog refresh. This controls which models MAK *offers* — never which
# model it uses (that is `planner.model` / `agents[].model` above, and a refresh
# never writes to this file). Refreshes run in the background on the 1st and
# 15th; `/refresh-models` in the CLI forces one immediately.
# models:
#   auto_refresh: true    # set false to never contact provider model-list APIs

git:
  auto_commit: true
  # Pushes only when the whole run succeeded (every wave, no declined or
  # wave-limited cascade) AND the test policy above is satisfied.
  auto_push: false
  commit_prefix: "[MAK]"
  # Refuse to start when the working tree has uncommitted changes, so `git diff`
  # after a run means exactly "what MAK did". Off by default: MAK's audit commits
  # are path-scoped and never absorb your staged work either way, so this is a
  # policy a project opts into rather than one MAK imposes.
  # require_clean_tree: false

# Semantic conflicts (Wave 20): two edits on different nodes that are each right
# and wrong together. Every setting below is optional; the values shown are the
# defaults.
# semantic:
#   # What a commit does when a node its bundle carried changed underneath it:
#   # accept_if_api_stable | revalidate | redispatch | reject.
#   stale_read: "revalidate"
#   # Split each node's lock into interface (node#api) and body (node).
#   api_locks: true
#   # A fragment write holds INTENT_WRITE on its file/class, so a whole-file or
#   # whole-class rewrite cannot run beside it.
#   intention_locks: true
#   # Keyed registrar functions (register("<key>", ...) lists) take appends in
#   # parallel and the kernel merges them; a repeated key is a collision.
#   registry_keys: true
#   # Dispatch dependents against a declared contract, not the implementation.
#   contract_dispatch: false
#   # Optional gates, all off by default. Findings become fix-up tasks.
#   type_check: "off"        # off | pyright | mypy
#   impact_tests: "off"      # off | on
#   import_smoke: "off"      # off | on
#   adjudicator: "off"       # off | <backend>:<model>
#   adjudicator_max_calls: 5
#   gate_timeout_s: 300
#   impact_max_overlays: 12

node_store:
  include_patterns:
    - "**/*.py"
  # How many on-disk versions of a node to keep: the committed one plus N-1
  # prior. Every commit writes a new version, so without a ceiling
  # .mak/node_store/ grows for the life of the project. The floor is 2 (revert
  # needs one prior version); -1 keeps every version forever.
  # version_retention: 5
  # Directories that are never project source. Keep "**/.mak/**" first: the node
  # store writes its fragments as .py files under .mak/node_store/, so ingesting
  # it would feed MAK its own output back as source on every run. (MAK skips its
  # own mak_dir unconditionally as well, so overriding this list is safe.)
  exclude_patterns:
    - "**/.mak/**"
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/.git/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/.tox/**"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
    - "**/site-packages/**"
