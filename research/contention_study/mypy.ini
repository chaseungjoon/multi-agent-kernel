# Type-checking configuration for the contention study only.
#
# Mirrors the kernel's `mypy --strict`. The one exemption a research pipeline
# genuinely needs is matplotlib, which ships no stubs mypy can follow under
# strict mode. Values read back from SQLite and from JSON are narrowed
# explicitly through `mining/jsonval.py` rather than cast or silenced.
[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
mypy_path = .:../..

[mypy-matplotlib.*]
ignore_missing_imports = True

