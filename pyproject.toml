[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-kernel"
dynamic = ["version"]
description = "A shared-memory-inspired orchestration kernel for concurrent multi-agent software development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.107.1",
    "openai>=2.41.0",
    "google-genai>=2.8.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    # Runtime, not tooling: node-store reconstruction formats every file it
    # reassembles (`mak/node_store/reconstruction.py`). Without ruff on the
    # install, every reconstructed file is written unformatted.
    "ruff>=0.5",
]

[project.scripts]
mak = "cli.__main__:main"

[project.optional-dependencies]
# Per-provider extras. The three SDKs stay in base `dependencies` above for now
# (Wave 15, D8): removing them changes the install contract, and `mak update` is
# a `uv tool install` from git that resolves fresh — it would strip the SDKs out
# from under every existing user mid-beta. The removal ships with the PyPI
# packaging work (Wave 9.3), alongside install docs. These extras exist now so
# every lazy-import failure message can name the command that fixes it.
anthropic = ["anthropic>=0.107.1"]
openai    = ["openai>=2.41.0"]
gemini    = ["google-genai>=2.8.0"]
# Deliberately empty, and the point worth documenting: MAK's native Ollama
# client is written against `urllib.request` and `json`, so a fully-local
# install needs **no** provider SDK at all.
local     = []
all       = ["multi-agent-kernel[anthropic,openai,gemini]"]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "types-PyYAML>=6.0",
]

[tool.setuptools.dynamic]
version = {attr = "mak._version.__version__"}

[tool.setuptools.packages.find]
include = ["mak*", "cli*"]

[tool.setuptools.package-data]
# The built-in default config must ship in the wheel: config discovery falls
# back to it when no ./mak.yaml or ~/.config/mak/config.yaml exists.
mak = ["config.yaml", ".env.example", "models/seed.json", "examples/*.yaml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

# Agent SDKs: declared dependencies, but imported lazily inside the adapters (so
# import time stays fast and a missing optional extra never breaks startup).
# anthropic/openai ship usable types; silence any missing-stub edge cases.
[[tool.mypy.overrides]]
module = ["anthropic", "openai"]
ignore_missing_imports = true

# google-genai ships a namespace package whose `genai.Client` mypy cannot always
# resolve; skip following it so the lazy import is treated as untyped either way
# (installed or not), matching the other optional-SDK adapters.
[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["mak", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
# D203/D213: conflicting docstring conventions. D107: __init__ is documented by
# the class docstring, not a separate one.
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["mak"]

[tool.ruff.lint.per-file-ignores]
# Test methods are self-documenting via descriptive names; docstrings not
# required. ANN401: test doubles for untyped SDKs mirror their **kwargs surface.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN401"]
# The API adapters wrap third-party SDKs (anthropic, openai) that ship no type
# stubs; the client and response objects are genuinely dynamic at this boundary,
# so typing.Any is the honest annotation. ANN401 is suppressed only here.
"mak/agent_runner/adapters/anthropic_api_adapter.py" = ["ANN401"]
"mak/agent_runner/adapters/openai_api_adapter.py" = ["ANN401"]
"mak/agent_runner/adapters/gemini_api_adapter.py" = ["ANN401"]
"mak/planner/llm.py" = ["ANN401"]
# The model-list fetchers wrap the same three untyped SDKs to read each
# provider's catalog; the response objects are dynamic at that boundary.
"mak/models/providers.py" = ["ANN401"]
# The stdlib Ollama client returns urlopen's result, which is an
# http.client.HTTPResponse in production and an injected double in tests — the
# seam that keeps every test off a socket. Naming either concrete type would
# break the other, so Any is the honest annotation at exactly that one boundary;
# every decoded JSON value in the module is typed `object` and narrowed.
"mak/local/ollama_client.py" = ["ANN401"]
# prompt_toolkit's key-binding handlers receive an untyped event object; there is
# no annotation to give it that is more honest than Any. Everything else in cli/
# is typed, and `mypy --strict` covers the package.
"cli/app.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
